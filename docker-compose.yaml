name: roboshop 
services:
  mongodb:
    build: ./mongodb
    image: ec2-user/mongodb:v1   
    container_name: mongodb 
    volumes:
    - mongodb:/data/db # mongodb stores data in this directory       
  catalogue:
    build: ./catalogue
    image: ec2-user/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: ec2-user/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment
  user:
    build: ./user
    image: ec2-user/user:v1
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb
  
  cart:
    build: ./cart
    image: ec2-user/cart:v1
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
    depends_on:
    - redis
    - catalogue

  redis:
    image: redis:7
    container_name: redis # docker run -d --name redis --network roboshop redis:7
    volumes:
    - radis: /data

  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  mysql:
    image: ec2-user/mysql:v1
    build: ./mysql
    container_name: mysql
    # command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    command: --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
    volumes:
    - mysql:/var/lib/mysql

  shipping:
    build: ./shipping
    image: ec2-user/shipping:v1
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: mysql
    depends_on:
    - mysql
    - cart  

  payment:
    build: ./payment
    image: ec2-user/payment:v1
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - user
    - rabbitmq
    - cart  
networks:
  default: 
    name: roboshop
    driver: bridge
    external: false

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq:


