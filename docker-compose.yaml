name: roboshop 
services:
  mongodb:
    build: ./mongodb
    image: ec2-user/mongodb:v1   
    container_name: mongodb        
  catalogue:
    build: ./catalogue
    image: ec2-user/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: ec2-user/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
  user:
    build: ./user
    image: ec2-user/user:v1
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb
  
  cart:
    build: ./cart
    image: ec2-user/cart:v1
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
    depends_on:
    - redis
    - catalogue

  redis:
    image: redis:7
    container_name: redis # docker run -d --name redis --network roboshop redis:7

  mysql:
    image: ec2-user/mysql:v1
    build: ./mysql
    container_name: mysql
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"

  shipping:
    build: ./shipping
    image: ec2-user/shipping:v1
    container_name: shipping
    environment:
      REDIS_HOST: redis
      CART_ENDPOINT: "cart:8080"
      DB_HOST: mysql
    depends_on:
    - mysql
    - cart  
networks:
  default: 
    name: roboshop
    driver: bridge
    external: false

